openapi: 3.0.3
info:
  title: Givaudan Sales AI Challenge API
  description: API back-end FastAPI pour le support des ventes et l'analyse de formulations/ingrédients Givaudan.
  version: '1.0.0'
servers:
  - url: http://localhost:8000/api/v1
    description: Serveur de développement local (Docker)
paths:
  /health:
    get:
      summary: Vérification de l'état du service
      responses:
        '200':
          description: Le service est opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /sales/analyze:
    post:
      summary: Analyse une opportunité de vente ou une requête client via l'IA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
                - query
              properties:
                client_id:
                  type: string
                  example: 'CL-98421'
                query:
                  type: string
                  example: "Recommander un profil olfactif boisé et frais pour un nouveau parfum d'intérieur."
      responses:
        '200':
          description: Résultat de l'analyse et suggestions générées
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendation_id:
                    type: string
                    example: 'REC-7732'
                  ingredients:
                    type: array
                    items:
                      type: string
                    example: ['Cèdre de Virginie', "Bergamote d'Italie"]
                  confidence_score:
                    type: number
                    example: 0.94

  /products:
    get:
      summary: Liste le catalogue des ingrédients et produits disponibles
      responses:
        '200':
          description: Liste récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: 'ING-012'
                    name:
                      type: string
                      example: 'Mandarine Verte'
                    category:
                      type: string
                      example: 'Agrume'
