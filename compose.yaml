# `docker compose up --build` démarre toute la tranche, sans commande à la main.
# Pour l'instant : le front Next.js seul. Les données sont des JSON fictifs
# embarqués dans l'application ; l'IA du compte rendu est simulée (règles).
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Quand le FastAPI de l'équipe Data sera prêt, décommenter :
    # environment:
    #   API_URL: http://api:8000
